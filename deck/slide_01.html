<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хэзэнштейн — личное приложение · PWA</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:var(--bg)}
  .shot-caption{color:var(--muted)}
</style>
</head>
<body>
<div class="slide">

  <!-- ambient orbs -->
  <div class="orb orb-violet" data-decor aria-hidden="true" style="width:640px;height:640px;left:-230px;top:-270px"></div>
  <div class="orb orb-cyan" data-decor aria-hidden="true" style="width:580px;height:580px;right:-210px;bottom:-250px"></div>

  <div style="position:relative;z-index:10;height:100%;display:flex;gap:52px;padding:56px 64px;align-items:stretch">

    <!-- LEFT : title block -->
    <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column">
      <div style="margin:auto 0">
        <div>
          <span class="chip" style="font-size:var(--fs-small)">
            <span class="material-icons" aria-hidden="true" style="font-size:15px;color:var(--cyan)">phone_iphone</span>
            Личное приложение · PWA
          </span>
        </div>

        <h1 style="font-family:var(--font-heading);font-weight:800;font-size:calc(var(--fs-display)*1.52);line-height:1.04;letter-spacing:-2px;margin:30px 0 0;color:var(--primary)">
          ХЭЗЭН<span class="grad-text">ШТЕЙН</span>
        </h1>

        <p class="muted" style="font-family:var(--font-heading);font-weight:600;font-size:var(--fs-h2);line-height:1.35;margin:20px 0 0;max-width:600px">
          Место, где мысли превращаются в порядок
        </p>

        <div style="margin-top:36px;font-family:var(--font-heading);font-weight:700;font-size:var(--fs-h3);letter-spacing:.4px;color:var(--cyan);white-space:nowrap">
          Заметки&nbsp;&nbsp;<span class="faint" style="font-weight:400">·</span>&nbsp;&nbsp;Задачи&nbsp;&nbsp;<span class="faint" style="font-weight:400">·</span>&nbsp;&nbsp;Календарь&nbsp;&nbsp;<span class="faint" style="font-weight:400">·</span>&nbsp;&nbsp;Желания&nbsp;&nbsp;<span class="faint" style="font-weight:400">·</span>&nbsp;&nbsp;ИИ
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:9px;font-size:var(--fs-small);white-space:nowrap">
        <span class="muted">Работает прямо в браузере</span>
        <span class="cyan-text" style="font-family:var(--font-heading);font-weight:700">→</span>
        <span style="font-family:var(--font-heading);font-weight:700;letter-spacing:.3px;color:var(--primary)">lexxgreat.github.io/hz3</span>
      </div>
    </div>

    <!-- RIGHT : real screenshot -->
    <div style="flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <img src="../assets/shot_main.webp" alt="Главный экран приложения Хэзэнштейн" class="phone-shot" style="height:min(560px,64vh);width:auto;display:block">
      <div class="shot-caption" style="margin-top:16px">Реальный экран приложения</div>
    </div>

  </div>
</div>
</body>
</html>
